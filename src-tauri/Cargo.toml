[package]
name = "ai-dev-terminal"
version = "0.1.6"
description = "AI Development Terminal MAX - parallel Claude Code multiplexer"
authors = ["foresthill"]
license = "MIT"
edition = "2021"

[lib]
name = "ai_dev_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# (2026-10-18 probe RESULT: a release built with `features=["devtools"]` was STILL
# black, so the inspector/`isInspectable` path is NOT the cause — reverted to []. The
# real display cause was the front layer's compositing promotion; see the vim doc.)
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
base64 = "0.22"
libc = "0.2"
sysinfo = "0.33"
tauri-plugin-clipboard-manager = "2.3.2"

# Auto-update (desktop only): check GitHub Releases' latest.json, download the
# signed update, and relaunch. Needs an updater signing key (see docs/updater-setup.md).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
