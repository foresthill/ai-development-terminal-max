<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CEF Terminal Spike</title>
    <!-- xterm vendored locally (no CDN) so it works on restricted/managed machines. -->
    <link rel="stylesheet" href="./vendor/xterm.css" />
    <script src="./vendor/xterm.js"></script>
    <script src="./vendor/addon-fit.js"></script>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0e14; color: #c8d3f5;
        font-family: -apple-system, system-ui, sans-serif; }
      #bar { padding: 6px 10px; font-size: 12px; color: #8aa; border-bottom: 1px solid #1c2333; }
      #bar b { color: #7aa2f7; }
      #status { color: #9ece6a; }
      /* On-screen error box — DevTools is blocked on managed Macs, so surface failures here. */
      #err { display: none; white-space: pre-wrap; color: #ff9aa2; background: #2a0f14;
        border: 1px solid #5a2630; margin: 8px 10px; padding: 8px 10px;
        font: 12px/1.5 Menlo, monospace; border-radius: 6px; }
      #term { position: absolute; top: 30px; left: 0; right: 0; bottom: 0; padding: 6px; }
    </style>
  </head>
  <body>
    <div id="bar">CEF Terminal Spike — type <b>vim</b> (or <b>htop</b>/<b>less</b>) and check it repaints. <span id="status">booting…</span></div>
    <div id="err"></div>
    <div id="term"></div>
    <script>
      const statusEl = document.getElementById("status");
      const errEl = document.getElementById("err");
      const say = (m) => { statusEl.textContent = m; };
      const showErr = (m) => { errEl.style.display = "block"; errEl.textContent = String(m); };
      // Any uncaught error lands on-screen (DevTools is blocked on managed Macs).
      window.addEventListener("error", (e) => showErr("JS error: " + (e.message || e.error)));
      window.addEventListener("unhandledrejection", (e) => showErr("Promise rejection: " + (e.reason && (e.reason.message || e.reason))));

      function b64ToBytes(b64) {
        const bin = atob(b64);
        const a = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
        return a;
      }

      async function boot() {
        if (typeof Terminal === "undefined") { showErr("xterm failed to load (./vendor/xterm.js)"); return; }
        if (typeof FitAddon === "undefined" || !FitAddon.FitAddon) { showErr("fit addon failed to load (./vendor/addon-fit.js)"); return; }
        const tauri = window.__TAURI__;
        if (!tauri || !tauri.core || !tauri.core.invoke) {
          showErr("window.__TAURI__.core.invoke missing — keys: " + (tauri ? Object.keys(tauri).join(",") : "(no __TAURI__)") +
            "\n(is app.withGlobalTauri true, and does Tauri 3 expose core.invoke?)");
          return;
        }
        const { invoke, Channel } = tauri.core;

        const term = new Terminal({
          fontFamily: "Menlo, monospace", fontSize: 13, cursorBlink: true,
          theme: { background: "#0b0e14", foreground: "#c8d3f5" },
        });
        const fit = new FitAddon.FitAddon();
        term.loadAddon(fit);
        term.open(document.getElementById("term"));
        fit.fit();

        const id = "spike-" + Math.random().toString(36).slice(2);
        const shell = await invoke("default_shell");
        const args = await invoke("shell_login_args");
        const cwd = await invoke("home_dir");

        const ch = new Channel();
        ch.onmessage = (b64) => term.write(b64ToBytes(b64));
        await invoke("spawn_pty", { id, shell, args, cwd, cols: term.cols, rows: term.rows, onOutput: ch });
        say("pty up (" + shell + ") — try vim");

        term.onData((d) => invoke("write_pty", { id, data: d }));
        const doResize = () => { fit.fit(); invoke("resize_pty", { id, cols: term.cols, rows: term.rows }).catch(() => {}); };
        new ResizeObserver(doResize).observe(document.getElementById("term"));
        window.addEventListener("beforeunload", () => invoke("kill_pty", { id }).catch(() => {}));
        term.focus();
      }
      boot().catch((e) => showErr("boot() failed: " + (e && (e.message || e)) + "\n" + (e && e.stack || "")));
    </script>
  </body>
</html>
