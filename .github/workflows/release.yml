name: release

# Cut a cross-platform release. Push a version tag (e.g. `v0.1.0`) and this
# builds macOS (universal), Windows and Linux installers on their own runners
# (Tauri can't cross-compile), then attaches them to a DRAFT GitHub Release for
# you to review and publish. `workflow_dispatch` lets you dry-run it by hand.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# tauri-action needs write access to create the release and upload assets.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # One macOS build that runs on both Apple Silicon and Intel.
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          # Built on 22.04 (older glibc) so the AppImage runs on more distros.
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # WebKitGTK + friends are required to build a Tauri app on Linux.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl wget file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # v10 to match the repo's pnpm-workspace.yaml (onlyBuiltDependencies is
          # v10-style config); v9 rejects that file with "packages field missing".
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Cache the Rust build so subsequent releases are much faster.
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Build is UNSIGNED. Do NOT wire the APPLE_* env unconditionally: when
          # the secrets are unset they expand to empty strings, which still makes
          # tauri-action attempt codesign and fail ("failed to import keychain
          # certificate"). To enable signing later, add an APPLE_* env block here
          # ONLY once the secrets exist (see docs/RELEASING.md).
        with:
          # On a tag push this is the tag (e.g. v0.1.0); on a manual run it's the
          # branch, which still produces a harmless draft you can delete.
          tagName: ${{ github.ref_name }}
          releaseName: "AI Dev Terminal MAX ${{ github.ref_name }}"
          releaseBody: "Download the installer for your OS below. Unsigned builds may show a first-launch security prompt — see docs/RELEASING.md."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
