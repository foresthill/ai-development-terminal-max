name: release

# Cut a cross-platform release. Push a version tag (e.g. `v0.1.0`) and this
# builds macOS (universal), Windows and Linux installers on their own runners
# (Tauri can't cross-compile), then attaches them to a DRAFT GitHub Release for
# you to review and publish. `workflow_dispatch` lets you dry-run it by hand.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# tauri-action needs write access to create the release and upload assets.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS = Apple Silicon (arm64) on macos-latest. CEF ships per-architecture so
          # universal-apple-darwin is NOT supported — pick one arch. The pinned labels are
          # gone: macos-14 was retired 2026-11-02 (→ instant t=0 cancel) and macos-13 is
          # older still (→ never allocates / starves). The only available label is
          # `macos-latest` = macOS 26 / Apple Silicon (arm64) — so build NATIVE aarch64 here.
          # Produces …_aarch64.dmg + a darwin-aarch64 updater entry. (Intel Macs aren't
          # targeted; macOS 26 is Apple-Silicon-era anyway.)
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust-targets: "aarch64-apple-darwin"
          # Built on 22.04 (older glibc) so the AppImage runs on more distros.
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # WebKitGTK + friends are required to build a Tauri app on Linux.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl wget file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      # CEF (Chromium) build prerequisites — macOS only. tauri-runtime-cef compiles CEF's
      # libcef_dll_wrapper via CMake + Ninja.
      - name: Install CEF build tools (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: brew install cmake ninja

      # Cache the pre-fetched CEF distribution so later releases skip the ~1GB download.
      - name: Cache CEF (macOS)
        if: startsWith(matrix.platform, 'macos')
        uses: actions/cache@v4
        with:
          path: ~/cef
          key: cef-macosarm64-154.0.34-minimal

      # Pre-fetch CEF and point CEF_PATH at it. WORKAROUND for two issues in
      # cef-dll-sys 154.5.0's build-time downloader:
      #  (1) it fetches Spotify's index.json via ureq, which caps the body at 10 MiB,
      #      but the index is larger → "json: the response body is larger than request
      #      limit: 10485760". We fetch the index with curl (no cap) instead.
      #  (2) it only accepts a pre-provided CEF_PATH whose dir contains an `archive.json`
      #      ({type,name,sha1}; its name's version must be <= the crate's CEF version),
      #      so we write that file into the extracted dir. Then the build skips its own
      #      index+download entirely. (See tauri-apps/cef-rs sys/build.rs + download-cef.)
      # The index is fetched every run and archive.json re-written so a cached ~/cef that
      # predates this (no archive.json) is repaired rather than re-triggering the download.
      - name: Provision CEF + set CEF_PATH (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          set -euo pipefail
          mkdir -p "$HOME/cef"
          echo "Fetching CEF index (curl, no 10MiB cap)…"
          curl -sSL https://cef-builds.spotifycdn.com/index.json -o /tmp/cef-index.json
          python3 -c "import json; d=json.load(open('/tmp/cef-index.json')); vs=[v for v in d['macosarm64']['versions'] if v['cef_version'].startswith('154.0.34+')]; assert vs,'no CEF 154.0.34 in index'; fs=[f for f in vs[0]['files'] if f['type']=='minimal'] or [f for f in vs[0]['files'] if f['type']=='standard']; f=fs[0]; open('/tmp/cef-url','w').write('https://cef-builds.spotifycdn.com/'+f['name']); open('/tmp/cef-archive.json','w').write(json.dumps({'type':f['type'],'name':f['name'],'sha1':f['sha1']}))"
          CEF_DIR="$(find "$HOME/cef" -maxdepth 1 -type d -name 'cef_binary_*' | head -1 || true)"
          if [ -z "$CEF_DIR" ]; then
            URL="$(cat /tmp/cef-url)"; echo "Downloading CEF: $URL"
            curl -sSL "$URL" -o /tmp/cef.tar.bz2
            tar -xjf /tmp/cef.tar.bz2 -C "$HOME/cef"
            CEF_DIR="$(find "$HOME/cef" -maxdepth 1 -type d -name 'cef_binary_*' | head -1)"
          fi
          test -n "$CEF_DIR"
          cp /tmp/cef-archive.json "$CEF_DIR/archive.json"
          echo "CEF_PATH=$CEF_DIR" >> "$GITHUB_ENV"
          echo "Using CEF_PATH=$CEF_DIR"; cat "$CEF_DIR/archive.json"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # v10 to match the repo's pnpm-workspace.yaml (onlyBuiltDependencies is
          # v10-style config); v9 rejects that file with "packages field missing".
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Cache the Rust build so subsequent releases are much faster.
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (NOT Apple codesign): required because tauri.conf has
          # bundle.createUpdaterArtifacts=true. Add these repo Secrets BEFORE the next
          # release or the build fails — see docs/updater-setup.md. (A missing secret
          # expands to empty, which tauri-action rejects when signing updater artifacts.)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple code-signing + notarization (Developer ID). macOS-only — these are
          # ignored on the Windows/Linux runners. With all six secrets set, the macOS
          # build is signed + notarized, so there's no Gatekeeper "unidentified
          # developer" warning AND the Documents/TCC permission persists across updates
          # (a stable signature, instead of a new ad-hoc one each release re-prompting).
          # tauri-action imports APPLE_CERTIFICATE (base64 .p12) into a temp keychain
          # and notarizes with APPLE_ID/APPLE_PASSWORD (app-specific)/APPLE_TEAM_ID.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          # On a tag push this is the tag (e.g. v0.1.0); on a manual run it's the
          # branch, which still produces a harmless draft you can delete.
          tagName: ${{ github.ref_name }}
          releaseName: "AI Dev Terminal MAX ${{ github.ref_name }}"
          releaseBody: |
            ## 日本語

            複数の Claude Code エージェントを並列で動かし、全部を一画面で俯瞰できる、クロスプラットフォーム（macOS / Windows / Linux）対応のターミナルアプリです。

            ### インストール
            下の **Assets** から、お使いのOSのファイルをダウンロードしてください。

            | OS | ダウンロードするファイル |
            |---|---|
            | 🍎 **macOS**（Apple Silicon / M系） | `..._aarch64.dmg` |
            | 🪟 **Windows** | `..._x64-setup.exe`（推奨）または `..._x64_en-US.msi` |
            | 🐧 **Linux** | `..._amd64.AppImage`（そのまま実行）／ `..._amd64.deb`（Debian・Ubuntu）／ `...x86_64.rpm`（Fedora・RHEL） |

            ⚠️ 未署名ビルドのため、初回起動時にOSのセキュリティ警告が出ます。
            - **macOS**: アプリを右クリック →「開く」。うまくいかなければ: `xattr -dr com.apple.quarantine "/Applications/AI Dev Terminal MAX.app"`
            - **Windows**: 「WindowsによってPCが保護されました」→「詳細情報」→「実行」

            **既知の制約**
            - vim など全画面TUI: この macOS 版は **Chromium (CEF) エンジン**で描画するため、従来 WKWebView で起きていた macOS 26 (Tahoe) の表示固まり（[wry#1848](https://github.com/tauri-apps/wry/issues/1848)）は解消し、**macOS 26 でも vim 等が正常に表示・操作できます**。Chromium を同梱するぶん、ダウンロードサイズは大きくなります（約 +170MB）。
            - ブラウザレイヤーは iframe（`X-Frame-Options` のサイトは埋め込み不可）

            ---

            ## English

            A native terminal app to run many Claude Code agents in parallel and see them all at once.

            ### Install
            Download the file for your OS from **Assets** below.

            | OS | File to download |
            |---|---|
            | 🍎 **macOS** (Apple Silicon) | `..._aarch64.dmg` |
            | 🪟 **Windows** | `..._x64-setup.exe` (recommended) or `..._x64_en-US.msi` |
            | 🐧 **Linux** | `..._amd64.AppImage` (portable) / `..._amd64.deb` (Debian/Ubuntu) / `...x86_64.rpm` (Fedora/RHEL) |

            ⚠️ Unsigned build — a first-launch security warning is expected.
            - **macOS**: right-click the app → "Open", or run: `xattr -dr com.apple.quarantine "/Applications/AI Dev Terminal MAX.app"`
            - **Windows**: SmartScreen → "More info" → "Run anyway"

            **Known limitations**
            - Full-screen TUIs like vim: this macOS build renders with the **Chromium (CEF) engine**, so the macOS 26 (Tahoe) display freeze that affected the old WKWebView build ([wry#1848](https://github.com/tauri-apps/wry/issues/1848)) is resolved — **vim and other TUIs display and work on macOS 26**. The trade-off is a larger download, since Chromium is bundled (~+170MB).
            - The browser layer is iframe-based (sites sending `X-Frame-Options` can't embed)
          releaseDraft: true
          # A tag with a pre-release suffix (e.g. v0.1.12-beta.1) is marked
          # pre-release, so `releases/latest` (what the updater reads) skips it and it
          # is NOT auto-shipped — install it manually to test. Clean tags ship normally.
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
